services:
  bot:
    build: .
    env_file:
      - .env
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./app:/app/app
    command: watchfiles --filter python "python app/main.py" app

  api:
    build: .
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    ports:
      - "8000:8000"
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000 --reload
