services:
  - type: web
    name: intima-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_WEB_ORIGIN
        sync: false

  - type: worker
    name: intima-telegram-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app/main.py
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: WEB_APP_URL
        sync: false

  - type: web
    name: intima-web
    runtime: static
    buildCommand: cd admin && npm ci && npm run build
    staticPublishPath: ./admin/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
